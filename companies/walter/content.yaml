    - type: steps
      at: what comes next
      head: What comes next
      items:
        - {title: Convert, text: Pilots become paying customers}
        - {title: Commercial, text: From residential to commercial portfolios}
        - {title: Funding, text: First round with external investors}
        - {title: Team, text: "Complete it, including co-founders"}
