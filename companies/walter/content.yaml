# walter: everything that appears on screen. Voice-over text lives in script.md, sources in SOURCES.md.
# Build First film (kind: build_first), visual version on the full voice-over take (Fred, 2 Nov 2026):
# every sentence gets a picture (real walter screens, team photos, charts), the voice runs without pauses.

company: walter
kind: build_first
number: 5
pacing: voice            # visuals follow the voice-over; no pauses are inserted into it
origin: "Berlin, Germany  ·  Founded 2026"
logo: {light: media/logo_light.png, dark: media/logo_dark.png}   # from the walter slides in the Commitment Days deck (light = walter's sage version, dark = same artwork in walter green #0d1d00)
pronounce: {valter: V AA L T ER, haeusser: HH OY S ER, eisenmann: AY Z AH N M AH N}

voice:
  take: media/vo.mp3
  intro: media/intro.mp3

handover:
  bg: media/app_home.jpg
  shot: media/app_home.jpg            # rises under the logo when the voice says "the first venture"
  shot_at: and the first
  shot_view: [0, 0, 890, 487]           # the app only, without the marketing panel on the right
  shot_size: [1407, 766]
  shot_caption: "Build First  ·  first venture fully launched on the market"

problem:
  panels:
    - type: notify            # a property manager's evening: everything arrives at once, each in a different tool
      items:
        - {icon: doc, title: Paper invoice to type in, meta: Accounting, time: "17:40"}
        - {icon: mail, title: "Heating failure, flat 12", meta: Tenant email, time: "17:46"}
        - {icon: phone, title: Missed calls, meta: 14 since lunch, time: "17:52"}
        - {icon: invoice, title: "Invoice #2026-089", meta: Waiting for approval, time: "18:03"}
        - {icon: sheet, title: Utility_billing_final_v7.xlsx, meta: Service charge statements, time: "18:10"}
        - {icon: calendar, title: Owner meeting, meta: Agenda still missing, time: "18:15"}
        - {icon: alert, kind: error, title: Property software, meta: Export failed, time: "18:21"}
        - {icon: people, kind: error, title: "Job ad: property manager", meta: Unfilled for 8 months, time: ""}
      item_at: [property, tenant, phone, invoices, service, owner, each in, good staff]
    - type: skyline           # every new building brings its own pile
      at: so every
      item_at: [so every, null, null, null, null, null, null, null, null, people]

how:
  panels:
    - type: ui                # the real walter object page: a building, its inbox, a tenant's request
      at: s0
      src: media/app_object.jpg
      size: [2048, 1131]
      url: walter · Bismarckstraße 88
      start: [0, 0, 2048, 1131]
      steps:
        - {at: he works, view: [1150, 440, 898, 691], box: [1174, 466, 853, 640], label: walter works inside the property file}
        - {at: every building, view: [330, 0, 1718, 440], box: [596, 116, 150, 48], label: One inbox per building}
        - {at: reads, view: [1174, 500, 853, 300], box: [1200, 560, 780, 170], label: walter reads the request}
        - {at: opens, view: [940, 330, 620, 300], box: [968, 380, 330, 52], label: Ticket opened}
        - {at: books, view: [330, 0, 1718, 440], box: [872, 116, 100, 48], label: Contractor booked}
    - type: ui                # everything else on the walter home screen, then the proposal to approve
      at: he also
      src: media/app_home.jpg
      size: [1407, 766]
      url: walter · Home
      start: [0, 0, 890, 476]
      overlays:
        - at: he also
          until: valter prepares
          pos: [1110, 200]
          kicker: Also handled by walter
          title: One place for the daily work
          rows:
            - {text: Documents and deadlines, icon: calendar}
            - {text: Invoices and banking, icon: invoice}
            - {text: Utility billing, icon: sheet}
            - {text: Owner meetings, icon: people}
            - {text: Letting and handovers, icon: building}
            - {text: App for tenants and owners, icon: chat}
          row_at: [documents, invoices, utility, owner, letting, an app]
        - at: valter prepares
          pos: [1110, 260]
          kicker: walter · proposal
          title: Water damage, bathroom
          rows:
            - {text: Ticket opened, status: Open}
            - {text: Contractor for plumbing, status: Requested}
            - {text: Reply to the tenant, status: Drafted}
          button: Approve
          done: Approved
          click_at: approves
    - type: path              # the roadmap: the whole property in one system
      at: next comes
      head: "Next: the whole property in one system"
      items:
        - {title: Property management, text: Residential and commercial, icon: building}
        - {title: Asset management, text: "Value, returns, reporting", icon: euro}
        - {title: Facility management, text: Technical operations, icon: wrench}
        - {title: Sale and data room, text: Up to the change of owner, icon: doc}
      item_at: [property asset, asset, facility, the sale]

team:
  panels:
    - type: path              # from idea to market
      at: s0
      head: From idea to market
      items:
        - {title: The idea, text: "Thomas Häusser, Partner<br>Karsten Eisenmann, Associate Partner<br>Drees & Sommer", icon: chat}
        - {title: Built with AI, text: By the TBV studio team, icon: wrench}
        - {title: On the market, text: Live within months, icon: check}
      item_at: [the idea, studio team, market launch]
    - type: faces
      at: christoph
      items:
        - {name: Christoph Wend-Erdel, role: Managing Director, photo: media/face_christoph.jpg}
        - {name: Alexander Assimidis, role: Managing Director, photo: media/face_alex.jpg}
        - {name: Philipp Piepenstock, role: Venture Architect, photo: media/face_philipp.jpg}
        - {name: Valentin Heidrich, role: Venture Architect, photo: media/face_valentin.jpg}
        - {name: Paul Koch, role: Venture Architect, photo: media/face_paul.jpg}
      item_at: [christoph, alexander, philipp, valentin, paul]

