interview:
  f1:
    founder: 0
    parts: [{video: media/interview.mp4, in: 0, dur: 20}]
    cutaways: []
  f2:
    parts: [{video: media/interview.mp4, in: 30, dur: 20}]
  f3:
    parts: [{video: media/interview.mp4, in: 60, dur: 20}]
  f4:
    parts: [{video: media/interview.mp4, in: 90, dur: 7}]
    words: [{at: 0.4, text: One.}, {at: 2.0, text: Two.}, {at: 4.0, text: Three.}]

close:
  tagline: The AI colleague for property management
  tagline_at: s1
