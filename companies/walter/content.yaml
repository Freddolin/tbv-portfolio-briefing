      at: what comes next
      head: What comes next
      items:
        - {title: Convert, text: Pilots become paying customers, kind: flip, from: Pilot, to: Paying}
        - {title: Commercial, text: From residential to commercial property management, kind: shift, icon_from: building, icon_to: tower}
        - {title: Funding, text: First round with external investors, kind: round, own: TBV, own_label: Today, new_label: + External investors}
        - {title: Team, text: "Complete it, including co-founders", kind: seats}
      item_at: [turn, grow from, prepare, complete]

