    - {type: statement, at: s0, text: "The opportunity<br>is large."}
    - type: kpis
      at: software for
      head: The market
      note: "Total market, walter business plan"
      items: [{value: DACH, label: "Germany, Austria and Switzerland"}, {value: "€1.5bn", label: a year for property management software}]
      item_at: [germany, one and a half]
    - type: steps
      at: valter starts
