      at: managing
      value: 3200
      per: 100
      display: "3,200+"
      label: units managed with walter
      extra: "€150k+ revenue potential per year"
      extra_at: revenue
      note: As of November 2026
    - type: bars
      at: the first customers
      head: From pilots to paying customers
      note: As of November 2026
      items:
        - {label: June, value: 4, tag: First pilots}
        - {label: July, value: 8}
        - {label: September, value: 22, tag: Market launch}
        - {label: Today, value: 30, tag: Converting to paid}
      item_at: [the first, null, null, paying]
    - type: units
