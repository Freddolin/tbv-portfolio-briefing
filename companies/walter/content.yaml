        - {label: July, value: 8}
        - {label: September, value: 22, tag: Market launch}
        - {label: Today, value: 30, tag: Converting to paid}
      item_at: [the first, customers, are now, being]
    - type: units             # picture: 7,700 units as a grid of buildings
      at: next in line
      head: Next in line
      value: 7700
      per: 100
      cols: 14
      icon_size: 52
      gap: 14
      display: "7,700"
      value_at: seven thousand
      label: units in a pilot agreed by handshake
      extra: "+ more commercial pilot customers"
      extra_at: commercial
