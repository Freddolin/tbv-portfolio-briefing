# walter: everything that appears on screen. Voice-over text lives in script.md, sources in SOURCES.md.
# Build First film (kind: build_first), script v3. Same mix as the other films (Fred, 2 Nov):
# on-screen text panels alternate with real pictures (walter screens, team photos, a chart).
# The voice runs without inserted pauses; panels cue to it.

company: walter
kind: build_first
number: 5
pacing: voice            # visuals follow the voice-over; no pauses are inserted into it
origin: "Berlin, Germany  ·  Founded 2026"
logo: {light: media/logo_light.png, dark: media/logo_dark.png}   # from the walter slides in the Commitment Days deck (light = walter's sage version, dark = same artwork in walter green #0d1d00)
pronounce: {valter: V AA L T ER, haeusser: HH OY S ER, eisenmann: AY Z AH N M AH N}

voice:
  take: media/vo.mp3
  intro: media/intro.mp3

handover:
  bg: media/app_home.jpg
  shot: media/app_home.jpg            # rises under the logo when the voice says "the first venture"
  shot_at: and the first
  shot_view: [0, 0, 890, 487]           # the app only, without the marketing panel on the right
  shot_size: [1407, 766]
  shot_caption: "Build First  ·  first venture fully launched on the market"
  converge: [mail, phone, invoice, sheet, calendar, alert, chat, wrench]   # the problem's loose ends fly into the logo
  logo_at: comes in
  tagline: An AI colleague for property managers
  tagline_at: an a i
  origin_at: colleague

problem:
  panels:
    - {type: statement, at: s0, text: "Property management<br>runs on manual work."}
    - type: notify            # picture: everything arrives at once, each in a different tool
      at: tenant
      items:
        - {icon: mail, title: "Heating failure, flat 12", meta: Tenant email, time: "17:46"}
        - {icon: phone, title: Missed calls, meta: 14 since lunch, time: "17:52"}
        - {icon: invoice, title: "Invoice #2026-089", meta: Waiting for approval, time: "18:03"}
        - {icon: sheet, title: Utility_billing_final_v7.xlsx, meta: Service charge statements, time: "18:10"}
        - {icon: calendar, title: Owner meeting, meta: Agenda still missing, time: "18:15"}
        - {icon: alert, kind: error, title: Property software, meta: Export failed, time: "18:21"}
      item_at: [tenant, phone, invoices, service, owner, each in]
    - type: pressure          # picture: a job ad nobody fills, then fees flat while costs climb
      at: good staff
      text: "Good staff are<br>hard to find."
      job: {kicker: Job ad, title: Property manager (m/f/d), months: 8, unit: months unfilled, status: Still open}
      text2: "Margins are<br>under pressure."
      text2_at: and margins
      chart_kicker: A property management firm
      fees: Fees
      costs: Costs
      margin: Margin
    - type: skyline           # picture: every new building brings its own pile
      at: new building
      item_at: [new building, null, null, null, null, null, null, null, null, people]

how:
  panels:
    - type: colleague         # picture: no new tool on the pile, a new member of the team
      at: s0
      text: "Not another<br>tool."
      tools:
        - {label: Property software, icon: doc}
        - {label: Email inbox, icon: mail}
        - {label: Excel lists, icon: sheet}
      cross_at: another tool
      text2: "A new<br>colleague."
      text2_at: he works
      team_kicker: The team
      team:
        - {role: Property manager, text: Tenants and owners, icon: people}
        - {role: Accounting, text: Invoices and billing, icon: invoice}
      walter_role: walter
      walter_text: AI colleague, prepares the work
      walter_tag: New
      walter_at: like a
    - type: beats             # text left, real walter screen right
      at: gets its own
      items:
        - {label: Inbox, head: "One inbox<br>per building", text: "Emails, calls and WhatsApp messages land with the right building.", image: media/shot_inbox.jpg}
        - {label: Request, head: "Reads it, opens a ticket,<br>books the contractor", text: "Example: a tenant reports water damage in the bathroom.", image: media/shot_email.jpg}
      item_at: [gets its own, opens a]
    - type: ui                # the walter home screen with everything else it handles
      at: he also
      src: media/app_home.jpg
      size: [1407, 766]
      url: walter · Home
      start: [0, 0, 890, 476]
      overlays:
        - at: he also
          pos: [1110, 200]
          kicker: Also handled by walter
          title: One place for the daily work
          rows:
            - {text: Documents and deadlines, icon: calendar}
            - {text: Invoices and banking, icon: invoice}
            - {text: Utility billing, icon: sheet}
            - {text: Owner meetings, icon: people}
            - {text: Letting and handovers, icon: building}
            - {text: App for tenants and owners, icon: chat}
          row_at: [documents, invoices, utility, owner, letting, an app]
          until: valter prepares
        - at: valter prepares     # walter prepares, the property manager clicks Approve
          pos: [1110, 230]
          kicker: walter · proposal
          title: Water damage, flat 12
          rows:
            - {text: Ticket opened, status: Open}
            - {text: Plumber requested, status: Prepared}
            - {text: Reply to the tenant, status: Drafted}
          row_at: [valter prepares, the work, the property]
          button: Approve
          done: Approved
          click_at: approves
    - type: stack             # version one is the ground floor; the roadmap builds the whole house
      at: first version
      text: "This is<br>version one."
      sub: It keeps growing along the walter roadmap,
      sub_at: valter keeps
      sub2: towards the whole property in one system.
      sub2_at: whole property
      pulse_at: property asset
      floors:                 # bottom to top: the value chain reads Asset, Property, Facility Management from the top
        - {title: Facility management, text: Technical operations, icon: wrench}
        - {title: Property management, text: "Residential today, commercial next", icon: building, live: true, tag: "Live · version 1"}
        - {title: Asset management, text: "Value, returns, reporting", icon: euro}
      item_at: [facility, asset]  # order of the non-live floors above (bottom to top)
      roof: Up to the sale and data room
      roof_at: the sale

