  panels:
    - {type: statement, at: s0, text: "Built in-house.<br>It started with a problem."}
    - type: origin            # two Drees & Sommer partners bring a problem to the studio
      at: thomas
      people:
        - {name: Thomas Häusser, role: "Partner<br>Drees & Sommer"}
        - {name: Karsten Eisenmann, role: "Associate Partner<br>Drees & Sommer"}
      people_at: [thomas, karsten]
      problem:
        at: saw property
        kicker: The problem they saw
        title: Property managers under growing margin pressure
        chart: Margin
        text: Processes must become far more efficient
        text_at: needing
      to_at: they brought
      to_caption: Studio  ·  Build First
    - type: loop              # Build First: build, test, validate; prototypes become the product
      at: in our build
      center: Build First
      team: [media/face_christoph.jpg, media/face_alex.jpg]
      team_at: christoph
      team_caption: Christoph, Alexander and the team
      nodes:
        - {title: Build, text: First prototypes, quickly}
        - {title: Test, text: With property managers}
        - {title: Validate, text: Assumptions checked}
      node_at: [first prototypes, tested, validated]
      final:
        at: customer feedback
        src: media/app_home.jpg
        size: [1407, 766]
        view: [0, 0, 890, 550]
        caption: Shaped by customer feedback
        tag: Now on the market
        tag_at: shaped the
    - type: faces             # picture: the team
      at: christoph and alexander
      items:
        - {name: Christoph Wend-Erdel, role: Managing Director, photo: media/face_christoph.jpg}
        - {name: Alexander Assimidis, role: Managing Director, photo: media/face_alex.jpg}
        - {name: Philipp Piepenstock, role: Venture Architect, photo: media/face_philipp.jpg}
        - {name: Valentin Heidrich, role: Venture Architect, photo: media/face_valentin.jpg}
        - {name: Paul Koch, role: Venture Architect, photo: media/face_paul.jpg}
